name: Validate agent package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate package and run tests
        shell: bash
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
          python scripts/build.py
      - name: Install verified CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          VF_INSTALL_DIR: ${{ runner.temp }}/voiceflow-bin
        run: |
          bash voiceflow/skills/voiceflow-setup/scripts/install-vf.sh
          python scripts/verify_cli.py --vf "$VF_INSTALL_DIR/vf"
      - name: Install verified CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VF_INSTALL_DIR: ${{ runner.temp }}/voiceflow-bin
        run: |
          & ./voiceflow/skills/voiceflow-setup/scripts/install-vf.ps1
          python scripts/verify_cli.py --vf (Join-Path $env:VF_INSTALL_DIR 'vf.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voiceflow-agent-package-${{ runner.os }}
          path: dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
